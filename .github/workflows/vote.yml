name: Vote Velthar

on:
  schedule:
    - cron: "0 0,3,6,9,12,15,18,21 * * *"
    - cron: "30 1,4,7,10,13,16,19,22 * * *"
  workflow_dispatch:

jobs:
  vote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer Xvfb et Tesseract
        run: |
          sudo apt-get install -y xvfb tesseract-ocr
          Xvfb :99 -screen 0 1280x900x24 &
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: Installer les packages Python
        run: pip install undetected-chromedriver selenium pytesseract Pillow requests

      - name: Voter
        env:
          VELTHAR_PASSWORD: ${{ secrets.VELTHAR_PASSWORD }}
          TWOCAPTCHA_API_KEY: ${{ secrets.TWOCAPTCHA_API_KEY }}
          PROXY_HOST: ${{ secrets.PROXY_HOST }}
          PROXY_PORT: ${{ secrets.PROXY_PORT }}
          PROXY_USER: ${{ secrets.PROXY_USER }}
          PROXY_PASS: ${{ secrets.PROXY_PASS }}
        run: python vote.py

      - name: Sauvegarder screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: "*.png"
          if-no-files-found: ignore
